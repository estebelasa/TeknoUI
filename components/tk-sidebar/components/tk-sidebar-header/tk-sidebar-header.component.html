<header class="tk-sidebar-header">

    @if (logo()) {

        <img
            class="tk-sidebar-header__logo"
            [src]="logo()!"
            [alt]="title()">

    }

    @if (!collapsed()) {

        <span class="tk-sidebar-header__title">

            {{ title() }}

        </span>

    }

    <button
        type="button"
        [attr.aria-label]="toggleLabel()"
        [attr.aria-expanded]="!collapsed()"
        (click)="collapse.emit()">

        <span aria-hidden="true">☰</span>

    </button>

</header>
