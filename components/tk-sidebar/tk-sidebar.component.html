<aside class="tk-sidebar">

    <!-- Header: the brand mark provided by the application, in both states. -->
    <tk-sidebar-header
        [title]="''"
        [collapsed]="selectors.isCollapsed()">
        <ng-content select="[tkSidebarBrand]" />
    </tk-sidebar-header>

    <!-- Profile row: same block, borders and height in both states (its content
         is hidden when collapsed); the collapse toggle sits on its right border. -->
    <div class="tk-sidebar__toggle-row">

        @if (profile()) {
            <tk-sidebar-profile
                [profile]="profile()!"
                [collapsed]="selectors.isCollapsed()">
                <!-- Optional brand mark for the profile block (e.g. shown when collapsed). -->
                <ng-content select="[tkSidebarProfileBrand]" />
            </tk-sidebar-profile>
        }

        <tk-sidebar-toggle
            [collapsed]="selectors.isCollapsed()"
            (toggled)="actions.toggle()">
        </tk-sidebar-toggle>

    </div>

    <tk-sidebar-navigation
        [items]="items()"
        [collapsed]="selectors.isCollapsed()"
        [selectedItemId]="selectors.selectedItem()"
        (itemSelected)="onItemClick($event)">
    </tk-sidebar-navigation>

    @if (footer()) {
        <tk-sidebar-footer
            [footer]="footer()!">
        </tk-sidebar-footer>
    }

</aside>
